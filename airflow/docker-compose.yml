# Local Airflow in one container (standalone mode: SQLite metadata, SequentialExecutor).
#   docker compose -f airflow/docker-compose.yml up --build
# UI: http://localhost:8080 (user admin, the password is printed in the container log on first start).
services:
  airflow:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      PIPELINE_ROOT: /opt/airflow/project
      PIPELINE_VENV: /home/airflow/pipeline-venv
      MLFLOW_TRACKING_URI: sqlite:////opt/airflow/project/mlflow_airflow.db
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ..:/opt/airflow/project
